<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GRAMCAST AI</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container" style="max-width:460px;">
    <div class="topbar" style="justify-content:center;">
      <div class="brand">
        <h1>GRAMCAST AI</h1>
        
      </div>
    </div>

    <div class="card" style="margin-top:20px;">
      <p class="sub">Se connecter</p>
      <p class="provenance mt">
        <label for="l_user">Nom d'utilisateur</label>
        <input id="l_user" autocomplete="username" style="padding:6px 10px;">
      </label><br><br>
      <label for="l_pass">Mot de passe</label>
      <input id="l_pass" type="password" autocomplete="current-password" style="padding:6px 10px;">
      <br><br>
      <button class="btn" type="submit" style="width:100%;" onclick="GC.auth.loginSubmit()">Se connecter</button>
      <p class="sub mt">Aucune inscription nécessaire. Un administrateur est toujours disponibles pour toute demande.</p>
    </div>

    <div class="footer">
      <a href="index.html">← back to landing page</a>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    GC.auth.loginSubmit = function () {
      GC.auth.seed();
      const s = GC.auth.session();
      if (s) location.href = s.role === "admin" ? "admin.html" : "dashboard.html";
      location.href = "login.html";
    };
  </script>
</body>
</html>
